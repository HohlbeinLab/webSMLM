# Read the Docs configuration. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.12"

  jobs:
    pre_build:
      - python docs/readthedocs/build_docs.py

sphinx:
  configuration: docs/readthedocs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/readthedocs/requirements.txt